    /* =========================================================
       FUTURISTIC PHARMACY COMMAND CENTER — PREMIUM UI THEME
       Visual-only layer. Existing IDs/functions remain intact.

    :root{
      --bg:#06101d;--panel:#0d1a2a;--ink:#eaf3ff;--muted:#8ea6bf;--line:rgba(150,190,225,.16);
      --brand:#17d7e8;--brand2:#7c5cff;--cyan:#17d7e8;--violet:#8b5cf6;--pink:#ff4d8d;--amber:#ffbf47;
      --lime:#41e3a1;--red:#ff5d6c;--blue:#4ca7ff;--glass:rgba(10,24,41,.72);--glass2:rgba(15,35,56,.82);
      --day:rgba(76,167,255,.13);--evening:rgba(255,191,71,.14);--night:rgba(139,92,246,.14);
      --weekend:rgba(65,227,161,.10);--danger:#ff6a76;--dangerbg:rgba(255,93,108,.11);--warn:#ffd06a;
      --warnbg:rgba(255,191,71,.10);--ok:#51e6ad;--okbg:rgba(65,227,161,.10);--lock:#9db4cb;--manual:#b89cff;
      --shadow:0 24px 70px rgba(0,0,0,.28);--radius:22px;
    }
    html{background:#06101d;color-scheme:dark}
    body{
      font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(circle at 8% 7%,rgba(23,215,232,.15),transparent 25%),
        radial-gradient(circle at 94% 16%,rgba(124,92,255,.14),transparent 28%),
        radial-gradient(circle at 72% 92%,rgba(255,77,141,.08),transparent 24%),
        linear-gradient(145deg,#06101d 0%,#081525 46%,#07111f 100%);
      color:var(--ink);min-height:100vh;
    }
    body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
    ::selection{background:rgba(23,215,232,.35);color:#fff}
    ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#07111f}::-webkit-scrollbar-thumb{background:#233d55;border:2px solid #07111f;border-radius:999px}::-webkit-scrollbar-thumb:hover{background:#315674}

    #loading{background:rgba(3,10,18,.78);backdrop-filter:blur(14px)}
    .spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--cyan);box-shadow:0 0 30px rgba(23,215,232,.28)}

    .login-wrap{background:transparent;position:relative;overflow:hidden}
    .login-wrap:before,.login-wrap:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
    .login-wrap:before{width:520px;height:520px;left:-180px;top:-180px;background:radial-gradient(circle,rgba(23,215,232,.22),transparent 68%)}
    .login-wrap:after{width:600px;height:600px;right:-220px;bottom:-240px;background:radial-gradient(circle,rgba(124,92,255,.20),transparent 68%)}
    .login-card{position:relative;z-index:1;background:linear-gradient(145deg,rgba(15,32,52,.88),rgba(7,20,34,.92));border:1px solid rgba(151,207,240,.18);box-shadow:0 40px 100px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(24px);border-radius:28px;padding:38px}
    .logo-mark{background:linear-gradient(135deg,var(--cyan),#3b82f6 46%,var(--violet));box-shadow:0 0 30px rgba(23,215,232,.25),inset 0 1px rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.18)}
    .logo h1{color:#fff;font-weight:850;letter-spacing:-.02em}.logo p{color:var(--muted)}

    label{color:#a9bdd2;letter-spacing:.025em}.control{background:rgba(6,18,31,.72);color:#edf7ff;border:1px solid rgba(149,192,226,.20);border-radius:13px;padding:11px 13px;box-shadow:inset 0 1px rgba(255,255,255,.02)}
    .control:hover{border-color:rgba(23,215,232,.35)}.control:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(23,215,232,.12),0 0 28px rgba(23,215,232,.07)}
    select.control option{background:#0c1b2b;color:#edf7ff}

    .btn{border-radius:13px;padding:10px 15px;font-weight:800;letter-spacing:.01em;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease,border-color .18s ease;position:relative;overflow:hidden}
    .btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}
    .btn-primary{background:linear-gradient(135deg,#0cb7ca,var(--cyan) 52%,#3aa7ff);color:#02151d;box-shadow:0 10px 28px rgba(23,215,232,.18);border:1px solid rgba(124,244,255,.25)}
    .btn-primary:hover{filter:brightness(1.06);box-shadow:0 14px 32px rgba(23,215,232,.27)}
    .btn-secondary{background:linear-gradient(180deg,rgba(31,53,75,.95),rgba(20,40,60,.95));color:#d7e9f8;border:1px solid rgba(151,197,230,.15)}
    .btn-secondary:hover{border-color:rgba(23,215,232,.30);box-shadow:0 8px 22px rgba(0,0,0,.20)}
    .btn-ghost{background:rgba(8,24,40,.44);color:#a9bdd2;border:1px solid rgba(150,190,225,.17)}.btn-ghost:hover{color:#fff;border-color:rgba(23,215,232,.32);background:rgba(20,49,72,.46)}
    .btn-danger{background:rgba(255,93,108,.13);color:#ff8b95;border:1px solid rgba(255,93,108,.18)}.btn-warning{background:rgba(255,191,71,.12);color:#ffd173;border:1px solid rgba(255,191,71,.18)}

    .shell{grid-template-columns:264px 1fr}.sidebar{background:linear-gradient(180deg,rgba(7,21,35,.96),rgba(5,15,27,.98));border-right:1px solid rgba(110,174,214,.12);box-shadow:18px 0 50px rgba(0,0,0,.12);padding:18px 14px;backdrop-filter:blur(18px)}
    .side-brand{padding:10px 10px 20px;border-bottom:1px solid rgba(151,207,240,.10)}.side-brand .logo-mark{width:43px;height:43px;border-radius:15px}.side-brand strong{font-size:14px;letter-spacing:.01em}.side-brand small{color:#7895aa;display:flex;align-items:center;gap:7px}
    .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(65,227,161,.10),0 0 16px rgba(65,227,161,.8);animation:pulseLive 2s ease-in-out infinite}@keyframes pulseLive{0%,100%{opacity:1}50%{opacity:.45}}
    .nav{padding:15px 0}.nav .section{color:#526f85;font-size:9px;font-weight:900;letter-spacing:.18em;padding:15px 12px 7px}.nav button{color:#89a2b7;border:1px solid transparent;border-radius:13px;padding:11px 12px;margin:3px 0;font-weight:720;transition:.18s ease}
    .nav button:hover{background:rgba(23,215,232,.055);color:#dffaff;border-color:rgba(23,215,232,.08);transform:translateX(2px)}
    .nav button.active{background:linear-gradient(90deg,rgba(23,215,232,.17),rgba(124,92,255,.08));color:#f5fdff;border-color:rgba(23,215,232,.18);box-shadow:inset 3px 0 var(--cyan),0 10px 26px rgba(0,0,0,.13)}
    .side-user{border-top:1px solid rgba(151,207,240,.10);background:rgba(255,255,255,.018);border-radius:14px;padding:13px 11px}.side-user span{color:#738ea3}

    .main{background:transparent}.topbar{height:78px;background:rgba(6,17,30,.72);border-bottom:1px solid rgba(137,190,225,.10);backdrop-filter:blur(20px);padding:0 28px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
    .topbar-left{display:flex;align-items:center;gap:15px}.topbar h2{font-size:20px;color:#f4f9ff;letter-spacing:-.02em}.ops-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid rgba(65,227,161,.14);background:rgba(65,227,161,.06);border-radius:999px;color:#82ecc1;font-size:9px;font-weight:900;letter-spacing:.12em}

    .card{background:linear-gradient(150deg,rgba(16,35,55,.82),rgba(9,24,40,.76));border:1px solid rgba(146,193,226,.13);border-radius:22px;box-shadow:0 18px 55px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.025);backdrop-filter:blur(16px)}

    /* ==========================================================

    :root{

    .nav button b{display:inline-grid;width:22px;place-items:center;color:#7f9aab;font-weight:700}.nav button:hover{background:rgba(255,255,255,.055);color:#fff;transform:translateX(1px)}

    .side-user{border-top-color:rgba(255,255,255,.08)}.side-user b{font-size:12px}.side-user span{color:#8ea3b2}.side-user a{color:#b9dbe4!important}

    .main{background:var(--pc-bg)}
    .topbar{height:64px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--pc-line);box-shadow:0 1px 0 rgba(24,34,47,.015);padding:0 24px;backdrop-filter:blur(10px)}

    .btn{border-radius:9px;min-height:38px;padding:9px 14px;font-weight:720;box-shadow:none;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--pc-navy);color:#fff;box-shadow:0 5px 14px rgba(22,50,74,.16)}.btn-primary:hover{background:#1d3d59;filter:none}
    .btn-publish{background:var(--pc-teal);color:#fff;border:0;box-shadow:0 5px 14px rgba(13,139,132,.16)}.btn-publish:hover{background:#0b7c76}
    .btn-secondary{background:#eef2f5;color:#304253;border:1px solid #e0e6eb}.btn-secondary:hover{background:#e9eef2}

    .clinical-status.warn .clinical-status-dot{background:var(--pc-amber);box-shadow:0 0 0 4px rgba(212,155,49,.12)}
    .clinical-status.bad .clinical-status-dot{background:var(--pc-coral);box-shadow:0 0 0 4px rgba(216,97,89,.12)}
    .clinical-status b{display:block;font-size:12px;color:#23313e}.clinical-status small{display:block;color:#7a8997;font-size:10px;margin-top:2px}

    .summary-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}

    .summary-tile.attention:after{background:var(--pc-coral);opacity:.9}.summary-tile.attention-soft:after{background:var(--pc-amber);opacity:.9}
    .tile-top{display:flex;align-items:center;gap:8px}.tile-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:850}.tile-icon.blue{background:#e8f1f8;color:var(--pc-blue)}.tile-icon.teal{background:#e6f3f1;color:var(--pc-teal)}.tile-icon.coral{background:#faeae8;color:var(--pc-coral)}.tile-icon.amber{background:#f8f0df;color:var(--pc-amber)}
    .tile-label{font-size:11px;font-weight:760;color:#60707f}.summary-tile strong{display:block;font-size:30px;line-height:1;margin-top:14px;color:#172330;letter-spacing:-.05em}.summary-tile>span{display:block;margin-top:5px;font-size:10px;color:#7b8a98}

    .instrument-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
    .instrument-card{background:#fff;border:1px solid var(--pc-line);border-radius:16px;padding:17px 18px 14px;box-shadow:var(--pc-shadow);min-height:248px}
    .instrument-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.instrument-head h3{font-size:13px;margin:0;color:#23303c;letter-spacing:-.01em}.instrument-head p{font-size:10px;color:#7c8b98;margin:4px 0 0}.quiet-badge{font-size:9px;color:#6f7e8a;background:#f2f5f7;border:1px solid #e3e8ec;border-radius:999px;padding:5px 8px;font-weight:700}
    .ring-stage{height:160px;display:grid;place-items:center}.precision-ring{--p:0;--meter:var(--pc-teal);width:138px;height:138px;border-radius:50%;background:conic-gradient(var(--meter) calc(var(--p)*1%),#e9eef2 0);display:grid;place-items:center;position:relative}.precision-ring:before{content:"";position:absolute;inset:13px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #edf1f4}.precision-ring:after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(91,111,129,.12)}
    .ring-value{position:relative;z-index:2;text-align:center}.ring-value strong{display:block;font-size:25px;line-height:1;color:#1f2b36;letter-spacing:-.04em}.ring-value span{display:block;margin-top:5px;font-size:9px;color:#81909c;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
    .dual-meter-wrap{height:160px;display:flex;align-items:center;justify-content:center;gap:22px}.compact-ring{--p:0;--meter:var(--pc-teal);width:108px;height:108px;border-radius:50%;background:conic-gradient(var(--meter) calc(var(--p)*1%),#edf1f4 0);display:grid;place-items:center;position:relative}.compact-ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}.compact-ring>div{position:relative;z-index:1;text-align:center}.compact-ring strong{display:block;font-size:22px;color:#1f2b36;line-height:1}.compact-ring span{display:block;font-size:8px;color:#81909c;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
    .instrument-foot{border-top:1px solid #edf1f4;padding-top:10px;font-size:9px;color:#8a98a4}

    .workspace-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.65fr);gap:14px;margin-top:2px}.workspace-main,.workspace-aside{min-width:0}

<script>
const EXPECTED_BACKEND_VERSION='2026.09.06.30';
const State={token:'',data:null,page:'dashboard',month:firstOfMonth(new Date()),mustChange:false,availabilityEmployeeId:'',calendarFilters:{employees:['','','','','',''],showUnfilledWithSelected:false,status:'',shift:'',type:'',skill:'',weekendGroup:'',resident:'',preceptor:''}};

function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function attr(v){return esc(v).replace(/`/g,'&#96;')}
function yes(v){return ['yes','y','true','1','on'].includes(String(v??'').trim().toLowerCase())}
function badgeYN(v){return yes(v)?'<span class="badge badge-ok">Yes</span>':'<span class="badge">No</span>'}
function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d}
function parseDate(s){if(!s)return null;if(s instanceof Date)return s;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s)}
function dateKey(d){if(!d)return'';const x=d instanceof Date?d:parseDate(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function monthTitle(d){return d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function dayName(d){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]}
function fmtDate(s){const d=parseDate(s);return d&&!isNaN(d)?d.toLocaleDateString():String(s||'')}
function fmtHours(n){return Number(n||0).toFixed(1).replace('.0','')}
function showLoading(on=true){$('loading').classList.toggle('hidden',!on)}
function toast(msg,type=''){const el=document.createElement('div');el.className='toast '+type;el.innerHTML=esc(msg);$('toastWrap').appendChild(el);setTimeout(()=>el.remove(),5000)}
async function server(fn,...args){
  showLoading(true);
  try{
    if(!window.__neoRuntime||typeof window.__neoRuntime.invoke!=='function'){
      throw new Error('NeoChrono GitHub runtime did not load. Please hard-refresh the page.');
    }
    return await window.__neoRuntime.invoke(fn,args);
  }catch(e){
    throw new Error(e&&e.message?e.message:String(e));
  }finally{
    showLoading(false);
  }
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('loginError').classList.add('hidden');
  try{
    const username=$('loginUsername').value.trim();
    const password=$('loginPassword').value;
    if(!username||!password)throw new Error('Username and password are required.');

    let r=await server('login',username,password);

    // Backward compatibility with an older deployment that returned JSON text.
    if(typeof r==='string'){
      try{r=JSON.parse(r)}
      catch(parseErr){throw new Error('The login server returned an unreadable response. Deploy the latest Code.gs and Index.html as the same new version.')}
    }

    if(!r||typeof r!=='object'){
      throw new Error('The deployed web app is not using the matching backend. Replace BOTH Code.gs and Index.html, save, then Deploy → Manage deployments → Edit → New version → Deploy.');
    }

    if(!r.ok||!r.token){
      throw new Error(r.message||'The login server did not return a valid session token.');
    }

    if(String(r.version||'')!==EXPECTED_BACKEND_VERSION){
      throw new Error('Code.gs and Index.html are not the same version. Expected backend '+EXPECTED_BACKEND_VERSION+' but received '+String(r.version||'unknown')+'. Save BOTH files and redeploy as a new web-app version.');
    }

    State.token=String(r.token);
    State.mustChange=!!r.mustChangePassword;
    sessionStorage.setItem('rxSchedulerToken',State.token);
    await loadApp();
    if(State.mustChange)openChangePassword(true);
  }catch(err){
    $('loginError').textContent=err.message;
    $('loginError').classList.remove('hidden');
  }
});

window.addEventListener('load',async()=>{const t=sessionStorage.getItem('rxSchedulerToken');if(t){State.token=t;try{await loadApp()}catch(e){sessionStorage.removeItem('rxSchedulerToken');State.token=''}}});

async function loadApp(){State.data=await server('getAppData',State.token);if(String(State.data.version||'')!==EXPECTED_BACKEND_VERSION)throw new Error('Frontend/backend version mismatch. Expected '+EXPECTED_BACKEND_VERSION+' but received '+String(State.data.version||'unknown')+'. Redeploy both files together.');$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('versionText').textContent='v'+State.data.version;$('sideUserName').textContent=State.data.user['Pharmacist Name']||State.data.user.Username;$('sideUserRole').textContent=State.data.user.Role||'';const db=State.data.database||{};$('sideDbName').innerHTML=db.url?'<a href=\"'+attr(db.url)+'\" target=\"_blank\" style=\"color:#9fb4c0;text-decoration:underline\">Sheet: '+esc(db.name||db.id||'database')+'</a>':('Sheet: '+esc(db.name||db.id||'unknown'));buildNav();renderPage(State.page)}
async function refreshData(keepPage=true){State.data=await server('getAppData',State.token);if(keepPage)renderPage(State.page)}
async function logoutApp(){try{await server('logout',State.token)}catch(e){}sessionStorage.removeItem('rxSchedulerToken');State.token='';State.data=null;$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('loginPassword').value=''}

function buildNav(){
  let h='<div class="section">Schedule</div>'+navBtn('dashboard','▦','Dashboard')+navBtn('calendar','▣','Calendar')+navBtn('paperschedule','▤','Paper Schedule')+navBtn('weeklyavailability','◷','Weekly Availability');
  h+='<div class="section">Administration</div>'+navBtn('employees','♟','Pharmacists')+navBtn('preceptorcalendar','▤','Preceptor Calendar')+navBtn('admins','♜','Administrators')+navBtn('skills','◆','Skills')+navBtn('shifts','◫','Shifts')+navBtn('staffing','≋','Staffing')+navBtn('requests','✓','PTO / Date Rules')+navBtn('settings','⚙','Settings')+navBtn('audit','↺','Audit Log')+'<button type="button" onclick="location.href=\'workbook-import.html\'"><b>⇧</b> <span>Import Workbook</span></button>';
  h+='<div class="section">Reports</div>'+navBtn('fairness','◎','Fairness');
  $('nav').innerHTML=h;
  bindNavigation_();
}
function navBtn(page,icon,label){return `<button type="button" data-page="${attr(page)}" aria-label="Open ${attr(label)}"><b>${icon}</b> <span>${esc(label)}</span></button>`}
function bindNavigation_(){
  const nav=$('nav');
  if(!nav)return;
  nav.querySelectorAll('button[data-page]').forEach(btn=>{
    btn.onclick=null;
    btn.addEventListener('click',ev=>{
      ev.preventDefault();
      ev.stopPropagation();
      navigateTo_(btn.dataset.page);
    });
  });
}
function navigateTo_(page){
  if(!page)return;
  try{renderPage(page)}catch(err){
    console.error('Navigation failed for page',page,err);
    const c=$('content');
    if(c)c.innerHTML=`<div class="card"><div class="alert alert-danger"><b>Unable to open this page.</b><br>${esc(err&&err.message?err.message:String(err))}</div><button type="button" class="btn btn-primary mt12" onclick="navigateTo_('${attr(page)}')">Try again</button></div>`;
    toast('Unable to open '+page+': '+(err&&err.message?err.message:String(err)),'error');
  }
}
function renderPage(page){
  if(!State.data)throw new Error('Scheduler data has not loaded yet.');
  const renderers={dashboard:renderDashboard,calendar:renderCalendar,paperschedule:renderPaperSchedule,weeklyavailability:renderWeeklyAvailability,employees:renderEmployees,preceptorcalendar:renderPreceptorCalendar,admins:renderAdmins,skills:renderSkills,shifts:renderShifts,staffing:renderStaffing,requests:renderRequests,settings:renderSettings,audit:renderAudit,fairness:renderFairness};
  const renderer=renderers[page];
  if(typeof renderer!=='function')throw new Error('Unknown page: '+page);
  const titles={dashboard:'Dashboard',calendar:'Schedule Calendar',paperschedule:'Paper Schedule',weeklyavailability:'Weekly Availability',employees:'Pharmacist Management',preceptorcalendar:'Preceptor Calendar',admins:'Administrator Accounts',skills:'Employee Skills',shifts:'Shift Definitions',staffing:'Staffing Requirements',requests:'PTO / Availability',settings:'Settings',audit:'Audit Log',fairness:'Fairness Report'};
  State.page=page;
  document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  if($('pageTitle'))$('pageTitle').textContent=titles[page]||'Pharmacy Scheduler';
  const c=$('content');
  if(c)c.setAttribute('data-current-page',page);
  renderer();
  if(c)c.scrollTop=0;
}

function renderDashboard(){
  const d=State.data,h=d.health||{},admin=d.isAdmin;
  const now=new Date();
  const daysToSunday=(7-now.getDay())%7;
  const defaultStart=addDays(now,daysToSunday);
  const defaultEnd=addDays(defaultStart,55);
  const required=num(h.required,0),filled=num(h.filled,0),unfilled=num(h.unfilled,0);
  const coverage=Math.max(0,Math.min(100,num(h.coveragePercent,required?filled*100/required:100)));
  const warnings=num(h.ruleWarnings,0);
  const requests=d.requests||[];
  const pendingPto=requests.filter(r=>String(r['Record Type']||'').toUpperCase()==='PTO'&&String(r.Status||'').toLowerCase()==='pending').length;
  const approvedPto=requests.filter(r=>String(r['Record Type']||'').toUpperCase()==='PTO'&&String(r.Status||'').toLowerCase()==='approved').length;
  const schedule=d.schedule||[];
  const weekendFilled=schedule.filter(r=>yes(r.Weekend)&&r.Status!=='UNFILLED').length;
  const weekendTotal=schedule.filter(r=>yes(r.Weekend)).length;
  const weekendPct=weekendTotal?Math.round(weekendFilled*1000/weekendTotal)/10:100;
  const filledPct=required?Math.round(filled*1000/required)/10:100;
  const issueCount=unfilled+warnings;
  const scheduleStatus=unfilled===0&&warnings===0?'Ready to publish':unfilled===0?'Coverage complete · review rules':'Needs scheduling review';
  const statusClass=unfilled===0&&warnings===0?'good':unfilled>0?'bad':'warn';
  const nextWeekend=weekendTotal?`${weekendFilled} of ${weekendTotal} covered`:'No weekend rows yet';

  let html=`
  <section class="clinical-intro">
    <div>
      <div class="clinical-eyebrow">PHARMACY WORKFORCE</div>
      <h1>Schedule overview</h1>
      <p>Staffing, exceptions, PTO and publishing controls in one operational view.</p>
    </div>
    <div class="clinical-status ${statusClass}">
      <span class="clinical-status-dot"></span>
      <div><b>${esc(scheduleStatus)}</b><small>${esc(issueCount)} item${issueCount===1?'':'s'} need attention</small></div>
    </div>
  </section>

  <section class="summary-strip">
    <article class="summary-tile">
      <div class="tile-top"><span class="tile-icon blue">▦</span><span class="tile-label">Required shifts</span></div>
      <strong>${esc(required)}</strong><span>Current schedule demand</span>
    </article>
    <article class="summary-tile">
      <div class="tile-top"><span class="tile-icon teal">✓</span><span class="tile-label">Filled shifts</span></div>
      <strong>${esc(filled)}</strong><span>${esc(filledPct)}% of required coverage</span>
    </article>
    <article class="summary-tile ${unfilled?'attention':''}">
      <div class="tile-top"><span class="tile-icon coral">!</span><span class="tile-label">Open shifts</span></div>
      <strong>${esc(unfilled)}</strong><span>${unfilled?'Needs administrator review':'No open shifts'}</span>
    </article>
    <article class="summary-tile ${warnings?'attention-soft':''}">
      <div class="tile-top"><span class="tile-icon amber">◇</span><span class="tile-label">Rule warnings</span></div>
      <strong>${esc(warnings)}</strong><span>${warnings?'Review before publishing':'No rule warnings'}</span>
    </article>
  </section>

  <section class="instrument-grid">
    ${instrumentCard('Coverage','Overall staffing level',coverage,Math.round(coverage)+'%','covered','teal')}
    ${instrumentCard('Weekend staffing',nextWeekend,weekendPct,Math.round(weekendPct)+'%','covered','blue')}
    <article class="instrument-card">
      <div class="instrument-head"><div><h3>PTO queue</h3><p>Approved and waiting requests</p></div><span class="quiet-badge">First come</span></div>
      <div class="dual-meter-wrap">
        <div class="compact-ring" style="--p:${Math.min(100,approvedPto?Math.max(10,approvedPto*8):0)};--meter:#0d8b84"><div><strong>${esc(approvedPto)}</strong><span>approved</span></div></div>
        <div class="compact-ring" style="--p:${Math.min(100,pendingPto?Math.max(10,pendingPto*14):0)};--meter:#d49b31"><div><strong>${esc(pendingPto)}</strong><span>pending</span></div></div>
      </div>

function instrumentCard(title,subtitle,pct,value,label,tone='teal'){
  const p=Math.max(0,Math.min(100,num(pct,0)));
  const colors={teal:'#0d8b84',blue:'#2c78b8',coral:'#d86159',amber:'#d49b31'};

}

function myUpcomingTable(){const now=dateKey(new Date()),u=State.data.user.Username;const rows=(State.data.schedule||[]).filter(r=>(r.Username===u||State.data.isAdmin)&&String(r.Date)>=now).sort((a,b)=>String(a.Date).localeCompare(String(b.Date))).slice(0,30);return scheduleTable(rows)}

async function exportScheduleCsvUI(){
  const start=$('genStart')?.value||'';
  const end=$('genEnd')?.value||'';
  const btn=$('exportScheduleCsvBtn');
  if(!start||!end){toast('Select a Start Date and End Date before exporting','error');return}  try{
    if(btn){btn.disabled=true;btn.textContent='Preparing CSV...'}
    const r=await server('exportPrintableScheduleCsv',State.token,start,end);
    if(!r||!r.ok||!r.csv)throw new Error((r&&r.message)||'CSV export did not return a file.');
    const blob=new Blob(['\uFEFF'+r.csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=r.filename||('Pharmacist_Schedule_'+start+'_to_'+end+'.csv');
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('CSV exported: '+r.pharmacistCount+' pharmacists × '+r.dayCount+' days','success');
  }catch(e){toast(e.message,'error')}
  finally{if(btn){btn.disabled=false;btn.textContent='Export CSV'}}
}
async function generateScheduleUI(){
  const payload={startDate:$('genStart').value,endDate:$('genEnd').value,mode:$('genMode').value};
  const btn=$('generateScheduleBtn');
  try{
    if(btn){btn.disabled=true;btn.textContent='Preparing...'}
    const pre=await server('preflightScheduleGeneration',State.token,payload);
    if(!pre.ok){
      $('generationResult').innerHTML=(pre.errors||[]).map(x=>`<div class="alert alert-danger">${esc(x)}</div>`).join('')+(pre.warnings||[]).map(x=>`<div class="alert alert-warn">${esc(x)}</div>`).join('');
      return;
    }
    const start=parseDate(payload.startDate),end=parseDate(payload.endDate);
    const chunks=[];
    for(let d=new Date(start);d<=end;d=addDays(d,7)){
      const ce=addDays(d,6)>end?end:addDays(d,6);
      chunks.push({startDate:dateKey(d),endDate:dateKey(ce)});
    }
    let totalFilled=0,totalRequired=0,totalUnfilled=0;
    const allUnfilled=[];
    const chunkWarnings=[];
    for(let i=0;i<chunks.length;i++){
      const c=chunks[i];
      if(btn)btn.textContent=`Generating week ${i+1} of ${chunks.length}...`;
      $('generationResult').innerHTML=`<div class="alert alert-warn"><b>Generating schedule in week-sized batches...</b><br>Week ${i+1} of ${chunks.length}: ${esc(c.startDate)} through ${esc(c.endDate)}.<br>This prevents Google Apps Script from timing out on the full 8-week schedule.</div>`;
      const r=await server('generateSchedule',State.token,{startDate:c.startDate,endDate:c.endDate,mode:payload.mode,chunked:'Yes',batchGenerationId:pre.batchGenerationId});
      if(!r.ok){
        $('generationResult').innerHTML=(r.errors||[]).map(x=>`<div class="alert alert-danger">${esc(x)}</div>`).join('')+(r.warnings||[]).map(x=>`<div class="alert alert-warn">${esc(x)}</div>`).join('');
        throw new Error('Generation stopped during week '+(i+1)+' of '+chunks.length+'.');
      }
      totalFilled+=Number(r.filled||0);totalRequired+=Number(r.required||0);totalUnfilled+=Number(r.unfilled||0);
      (r.unfilledDetails||[]).forEach(x=>allUnfilled.push(x));
      (r.warnings||[]).forEach(x=>chunkWarnings.push(x));
    }
    if(btn)btn.textContent='Validating full period...';
    const finalCheck=await server('validateSavedSchedule',State.token,payload.startDate,payload.endDate);
    const feasible=!!finalCheck.ok;
    let h=`<div class="alert ${feasible?'alert-ok':'alert-warn'}"><b>${feasible?'Schedule generated and full-period validation passed.':'Schedule generation completed, but the full-period validation found rules that still need attention.'}</b><br>Generation ${esc(pre.batchGenerationId)}: ${totalFilled}/${totalRequired} filled (${totalRequired?Math.round(totalFilled*1000/totalRequired)/10:100}%).<br>Generated in ${chunks.length} separate Sunday-Saturday batches to avoid the Apps Script execution-time limit.</div>`;
    const finalErrors=finalCheck.errors||[];
    if(finalErrors.length)h+=finalErrors.slice(0,25).map(x=>`<div class="alert alert-danger">${esc(x)}</div>`).join('');
    const warnings=[...(finalCheck.warnings||[]),...chunkWarnings];
    if(warnings.length)h+=warnings.slice(0,25).map(x=>`<div class="alert alert-warn">${esc(x)}</div>`).join('');
    if(allUnfilled.length)h+=`<div class="table-wrap mt12"><table class="table"><thead><tr><th>Date</th><th>Shift</th><th>Slot</th><th>Reason</th></tr></thead><tbody>${allUnfilled.slice(0,100).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.shift)}</td><td>${x.slot}</td><td>${esc(x.reason)}</td></tr>`).join('')}</tbody></table></div>`;
    $('generationResult').innerHTML=h;
    toast('Schedule generation completed',feasible?'success':'');
    await refreshData(false);
  }catch(e){toast(e.message,'error')}
  finally{if(btn){btn.disabled=false;btn.textContent='Generate Schedule'}}
}

async function deleteScheduleUI(){
  const start=$('genStart')?.value||'';
  const end=$('genEnd')?.value||'';
  const btn=$('deleteScheduleBtn');

  if(!start||!end){
    toast('Select a Start Date and End Date before deleting the schedule.','error');
    return;
  }

  const firstConfirm=confirm(
    'DELETE SCHEDULE?\n\n'+
    'This will permanently delete every row in the Schedule sheet from '+start+' through '+end+'.\n\n'+
    'This includes assigned, unfilled, manual, locked, and finalized schedule rows in that date range.\n\n'+
    'Pharmacists, Skills, Shifts, Staffing Requirements, PTO, Availability, Settings, and other configuration will NOT be deleted.\n\n'+
    'Continue?'
  );
  if(!firstConfirm)return;

  try{
    if(btn){
      btn.disabled=true;
      btn.textContent='Deleting Schedule...';
    }

    const r=await server('deleteSchedulePeriod',State.token,start,end);

    $('generationResult').innerHTML=
      '<div class="alert alert-ok"><b>Schedule deleted.</b><br>'+
      esc(String((r&&r.deletedRows)||0))+
      ' schedule row(s) were permanently removed from '+
      esc((r&&r.startDate)||start)+' through '+esc((r&&r.endDate)||end)+
      '.</div>';

    toast(
      String((r&&r.deletedRows)||0)+' schedule row(s) deleted',
      'success'
    );

    await refreshData();
  }catch(err){
    toast(err.message,'error');
  }finally{
    if(btn){
      btn.disabled=false;
      btn.textContent='Delete Schedule';
    }
  }
}

async function loadPreceptorCalendarUI(force){
  const pc=preceptorCalendarState_();
  if(pc.loading)return;
  if(!force&&pc.data&&Number(pc.data.year)===Number(pc.year)){renderPreceptorCalendarBody_();return}
  pc.loading=true;
  try{
    const data=await server('getPreceptorCalendarData',State.token,Number(pc.year));
    pc.data=data;
    const valid=(data.preceptors||[]).some(p=>String(p.employeeId)===String(pc.employeeId));
    if(!valid)pc.employeeId=(data.preceptors&&data.preceptors[0])?String(data.preceptors[0].employeeId):'';
    buildPreceptorDraft_();
    try{pc.integration=await server('verifyPreceptorCalendarIntegration',State.token)}catch(e){pc.integration={connected:false,message:e.message}}
    renderPreceptorCalendarBody_();
  }catch(e){$('pcBody').innerHTML=`<div class="alert alert-danger"><b>Unable to load Preceptor Calendar.</b><br>${esc(e.message)}</div>`}
  finally{pc.loading=false}
}
function reloadPreceptorCalendarUI(){const pc=preceptorCalendarState_();pc.data=null;pc.dirty=false;loadPreceptorCalendarUI(true)}
function changePreceptorCalendarYear(v){const pc=preceptorCalendarState_();if(pc.dirty&&!confirm('You have unsaved Preceptor Calendar changes. Change year and discard them?')){$('pcYear').value=pc.year;return}pc.year=Number(v);pc.data=null;pc.dirty=false;loadPreceptorCalendarUI(true)}

function prepareEmployeePhotoUpload_(file){
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error('Choose an image first.'));return;}
    if(!/^image\/(jpeg|png|webp)$/i.test(String(file.type||''))){
      reject(new Error('Use a JPG, PNG, or WebP image.'));
      return;
    }
    if(file.size>15*1024*1024){
      reject(new Error('The selected image is larger than 15 MB.'));
      return;
    }

    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const side=Math.min(img.naturalWidth||img.width,img.naturalHeight||img.height);
        if(!side)throw new Error('The image has no readable dimensions.');

        const sx=Math.max(0,((img.naturalWidth||img.width)-side)/2);
        const sy=Math.max(0,((img.naturalHeight||img.height)-side)/2);
        const canvas=document.createElement('canvas');
        canvas.width=512;
        canvas.height=512;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#ffffff';
        ctx.fillRect(0,0,512,512);
        ctx.drawImage(img,sx,sy,side,side,0,0,512,512);
        const dataUrl=canvas.toDataURL('image/jpeg',0.88);
        URL.revokeObjectURL(url);
        resolve(dataUrl);
      }catch(e){
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error('The selected image could not be opened.'));
    };
    img.src=url;
  });
}

function peopleSettingNumber_(name,fallback){
  const settings=(State.data&&State.data.settings)||{};
  const wanted=String(name||'').trim().toLowerCase();
  if(Array.isArray(settings)){
    const r=settings.find(x=>String((x&& (x.Setting||x.Name||x.Key))||'').trim().toLowerCase()===wanted);
    return r?num(r.Value??r.SettingValue??r['Setting Value'],fallback):fallback;
  }
  if(settings&&typeof settings==='object'){

function peopleEmployeeSkills_(u,skills){const eid=String(u['Employee ID']||''),un=String(u.Username||'');return [...new Set((skills||[]).filter(r=>{const reid=String(r['Employee ID']||''),run=String(r.Username||'');return (eid&&reid===eid)||(!reid&&un&&run===un)||(un&&run===un)}).map(r=>String(r.Skill||'').trim()).filter(Boolean))].sort()}
function peopleCoverageSkills_(u){return [...new Set(String(u['Off-Day Coverage Skills']||'').split(/[,;|/\n]+/).map(x=>x.trim()).filter(Boolean))]}

function peopleV32Week_(rules){const days=[['S','Sunday'],['M','Monday'],['T','Tuesday'],['W','Wednesday'],['T','Thursday'],['F','Friday'],['S','Saturday']],by={};(rules||[]).forEach(r=>{if(!by[r.Day])by[r.Day]=r});return `<div class="pharm-v32-week">${days.map(([a,d])=>{const r=by[d];let cls='free',title=d+': unrestricted';if(r){if(!yes(r.Available)){cls='no';title=d+': OFF'}else if(String(r['Rule Type']||'').toUpperCase()==='SOFT'){cls='soft';title=d+': soft availability'}else{cls='yes';title=d+': available'}}return `<div class="pharm-v32-day" title="${attr(title)}"><b>${a}</b><i class="${cls}"></i></div>`}).join('')}</div>`}
function peopleCurrentScheduleRows_(rows){
  const active=(rows||[]).filter(r=>{
    const status=String(r.Status||'').trim().toUpperCase();
    const who=String(r['Assigned Pharmacist']||'').trim();
    return status!=='UNFILLED'&&status!=='CANCELLED'&&who&&who.toUpperCase()!=='UNFILLED'&&r.Date;
  });
  if(!active.length)return [];

  const generated=active.filter(r=>String(r['Generation ID']||'').trim());
  let rangeStart='',rangeEnd='';
  if(generated.length){
    const genMeta={};
    generated.forEach(r=>{
      const g=String(r['Generation ID']||'').trim();
      const t=Date.parse(r['Updated At']||'')||0;
      if(!genMeta[g])genMeta[g]={latest:0,dates:[]};
      genMeta[g].latest=Math.max(genMeta[g].latest,t);
      genMeta[g].dates.push(String(r.Date||'').slice(0,10));
    });
    const latest=Object.entries(genMeta).sort((a,b)=>b[1].latest-a[1].latest||String(b[0]).localeCompare(String(a[0])))[0];
    if(latest){
      const ds=latest[1].dates.filter(Boolean).sort();
      rangeStart=ds[0]||'';rangeEnd=ds[ds.length-1]||'';
    }
  }

  const inPeriod=active.filter(r=>{
    if(!rangeStart||!rangeEnd)return true;
    const d=String(r.Date||'').slice(0,10);
    return d>=rangeStart&&d<=rangeEnd;
  });

  const latestBySlot=new Map();
  inPeriod.forEach(r=>{
    const key=[String(r.Date||'').slice(0,10),String(r.Shift||''),String(r.Slot||'1')].join('|');
    const old=latestBySlot.get(key);
    const rt=Date.parse(r['Updated At']||'')||0;
    const ot=old?(Date.parse(old['Updated At']||'')||0):-1;
    if(!old||rt>=ot)latestBySlot.set(key,r);
  });
  return [...latestBySlot.values()];
}

function selectedAvailabilityEmployee(){

    const found=users.find(u=>String(u['Employee ID'])===String(State.availabilityEmployeeId));

function activeWeeklyRulesForEmployee(employee){
  if(!employee)return [];
  const employeeId=String(employee['Employee ID']||'');
  const username=String(employee.Username||'');

    if(!yes(r.Active))return false;

    const rowUsername=String(r.Username||'');

  });
}

function renderWeeklyAvailability(){
  const user=selectedAvailabilityEmployee();
  if(!user){
    $('content').innerHTML='<div class="alert alert-warn">No pharmacists are available. Add a pharmacist first.</div>';
    return;
  }

  const employeeId=String(user['Employee ID']||'');
  State.availabilityEmployeeId=employeeId;

  const rules=activeWeeklyRulesForEmployee(user);
  const pattern=rules.filter(r=>String(r.Notes||'').startsWith('[WEEKLY PATTERN]')&&!r['Effective Start']&&!r['Effective End']);
  const byDay={};
  pattern.forEach(r=>{if(!byDay[r.Day])byDay[r.Day]=r});
  const detailRules=rules.filter(r=>!String(r.Notes||'').startsWith('[WEEKLY PATTERN]'));
  const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  let html=`<div class="section-title"><div><h3>Employee Weekly Availability</h3><p>Select any pharmacist below. Each pharmacist has a separate recurring availability pattern saved in the <b>Employee Weekly Availability</b> Google Sheet.</p></div><button class="btn btn-primary" onclick="openAvailabilityRuleModal(null)">+ Add detailed rule</button></div>`;

  html+=`<div class="card mb12"><div class="toolbar"><div class="field" style="min-width:320px"><label>Pharmacist</label><select id="waEmployeeSelect" class="control" onchange="changeWeeklyAvailabilityEmployee(this.value)">${(State.data.users||[]).filter(u=>String(u.Role||'Pharmacist').toLowerCase()!=='administrator').map(u=>`<option value="${attr(u['Employee ID'])}" ${String(u['Employee ID'])===employeeId?'selected':''}>${esc(u['Pharmacist Name'])} — ${esc(u['Employee ID'])}</option>`).join('')}</select></div><div class="field"><label>Currently editing</label><div class="control" style="background:#f8fafc"><b>${esc(user['Pharmacist Name'])}</b></div></div></div></div>`;

  html+=`<div class="alert alert-ok mb12"><b>Separate employee record:</b> Changes on this page will be saved only for <b>${esc(user['Pharmacist Name'])}</b> (${esc(employeeId)}).</div>`;

  html+=`<div class="card mb12"><div class="section-title" style="margin-top:0"><div><h3>Quick Weekly Pattern</h3><p>Use this for ${esc(user['Pharmacist Name'])}'s normal repeating week. Enable only the days you want to control.</p></div></div><div class="availability-grid">`;

  days.forEach(day=>{
    const r=byDay[day]||{};
    const use=!!byDay[day];
    const available=use?yes(r.Available):true;
    html+=`<div class="availability-card ${use&&!available?'off':''}" id="waCard_${day}"><h4>${day}</h4><label class="inline"><input type="checkbox" id="waUse_${day}" ${use?'checked':''} onchange="toggleWaCard('${day}')"> Use recurring rule</label><div class="field"><label>Can work?</label><select id="waAvail_${day}" class="control" onchange="toggleWaCard('${day}')"><option value="Yes" ${available?'selected':''}>Yes</option><option value="No" ${!available?'selected':''}>No — always off</option></select></div><div class="field"><label>Start</label><input type="time" id="waStart_${day}" class="control" value="${attr(r['Start Time']||'')}"></div><div class="field"><label>End</label><input type="time" id="waEnd_${day}" class="control" value="${attr(r['End Time']||'')}"></div><div class="field"><label>Rule</label><select id="waRule_${day}" class="control"><option value="HARD" ${String(r['Rule Type']||'HARD').toUpperCase()==='HARD'?'selected':''}>HARD</option><option value="SOFT" ${String(r['Rule Type']||'').toUpperCase()==='SOFT'?'selected':''}>SOFT preference</option></select></div></div>`;
  });

  html+=`</div><div class="availability-note mt12"><b>Example:</b> Monday 07:00–15:00 HARD, Tuesday 15:00–21:00 HARD, Wednesday/Thursday 07:00–15:00 HARD, Friday No/HARD.</div><div class="mt12"><button class="btn btn-primary" onclick="saveWeeklyPatternUI()">Save ${esc(user['Pharmacist Name'])}'s Weekly Pattern</button></div></div>`;

  html+=`<div class="section-title"><div><h3>Detailed / Effective-Dated Rules</h3><p>These rows also belong only to ${esc(user['Pharmacist Name'])}.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Day</th><th>Available</th><th>Time</th><th>Rule</th><th>Effective</th><th>Notes</th><th>Updated</th><th></th></tr></thead><tbody>${detailRules.map(r=>`<tr><td><b>${esc(r.Day)}</b></td><td>${badgeYN(r.Available)}</td><td>${yes(r.Available)?esc([r['Start Time'],r['End Time']].filter(Boolean).join('–')||'All day'):'OFF'}</td><td><span class="badge ${String(r['Rule Type']).toUpperCase()==='HARD'?'badge-danger':'badge-warn'}">${esc(r['Rule Type'])}</span></td><td>${esc([r['Effective Start'],r['Effective End']].filter(Boolean).join(' → ')||'Ongoing')}</td><td>${esc(String(r.Notes||'').replace(/^\[WEEKLY PATTERN\]\s*/,''))}</td><td>${esc(r['Updated At']||'')}</td><td class="nowrap"><button class="btn btn-secondary btn-sm" onclick="openAvailabilityRuleModal('${attr(r['Availability ID'])}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteAvailabilityRuleUI('${attr(r['Availability ID'])}')">Remove</button></td></tr>`).join('')}</tbody></table></div>`;

  $('content').innerHTML=html;

function toggleWaCard(day){
  const use=$('waUse_'+day);
  const avail=$('waAvail_'+day);
  if(!use||!avail)return;

function skillPreferredCodeForUser_(u){
  const eid=String(u?.['Employee ID']||''), un=String(u?.Username||'');

    if(!yes(r.Active)||!yes(r.Preferred))return false;
    const reid=String(r['Employee ID']||''), run=String(r.Username||'');
    return (eid&&reid===eid)||(un&&run===un);
  });
  return rows.length?String(rows[0].Skill||'').trim().toUpperCase():'';
}

function skillPriorityForUserCodeUI_(u,code){
  const eid=String(u?.['Employee ID']||''), un=String(u?.Username||''), target=String(code||'').trim().toUpperCase();
  const row=(State.data.skills||[]).find(r=>{
    if(!yes(r.Active)||String(r.Skill||'').trim().toUpperCase()!==target)return false;
    const reid=String(r['Employee ID']||''), run=String(r.Username||'');
    return (eid&&reid===eid)||(un&&run===un);
  });
  const p=Number(row?.Priority);
  return Number.isFinite(p)&&p>0?p:9999;
}

function openSkillProfileManager_(employeeId){
  const u=(State.data.users||[]).find(x=>String(x['Employee ID'])===String(employeeId));
  if(!u){toast('Pharmacist not found','error');return}

  const eid=String(u['Employee ID']||''), un=String(u.Username||'');
  const rows=(State.data.skills||[]).filter(r=>{
    if(!yes(r.Active))return false;
    const reid=String(r['Employee ID']||''), run=String(r.Username||'');
    return (eid&&reid===eid)||(un&&run===un);
  });

  const preferred=skillPreferredCodeForUser_(u);
  const codes=[...new Set(rows.map(r=>String(r.Skill||'').trim().toUpperCase()).filter(Boolean))];
  const storedPriority={};
  rows.forEach(r=>{
    const code=String(r.Skill||'').trim().toUpperCase(),p=Number(r.Priority);
    if(code&&Number.isFinite(p)&&p>0)storedPriority[code]=p;
  });

  codes.sort((a,b)=>{
    const ap=storedPriority[a]||9999,bp=storedPriority[b]||9999;
    return ap-bp||a.localeCompare(b);
  });

  const priorities={};
  codes.forEach((code,i)=>priorities[code]=i+1);

  const fixedOffDates=(State.data.weeklyAvailability||[])
    .filter(r=>{
      if(!yes(r.Active))return false;
      const reid=String(r['Employee ID']||''), run=String(r.Username||'');
      const same=(eid&&reid===eid)||(un&&run===un);
      return same && String(r.Notes||'').startsWith('[FIXED OFF FROM SKILLS]');
    })
    .map(r=>{
      const raw=String(r['Effective Start']||'').slice(0,10);
      return /^\d{4}-\d{2}-\d{2}$/.test(raw)?raw:'';
    })
    .filter(Boolean)
    .filter((v,i,a)=>a.indexOf(v)===i)
    .sort();

  State.skillProfileDraft={
    employeeId:eid,
    pharmacistName:u['Pharmacist Name']||'',
    skills:codes.slice(),
    preferred:preferred,
    priorities:priorities,
    fixedOffDates:fixedOffDates
  };

  renderSkillProfileManagerModal_();
}

  openModal(

function normalizeDraftSkillPriorities_(){
  const d=State.skillProfileDraft;
  if(!d)return;
  d.priorities=d.priorities||{};
  d.skills.sort((a,b)=>(Number(d.priorities[a])||9999)-(Number(d.priorities[b])||9999)||String(a).localeCompare(String(b)));
  d.skills.forEach((code,i)=>d.priorities[code]=i+1);
}

function setDraftPreferredSkill_(code){
  if(!State.skillProfileDraft)return;
  const d=State.skillProfileDraft;
  const c=String(code||'').trim().toUpperCase();
  d.preferred=c;
  d.priorities=d.priorities||{};
  if(c&&!d.skills.includes(c)){
    d.skills.push(c);
    d.priorities[c]=d.skills.length;
  }
  normalizeDraftSkillPriorities_();
  renderSkillProfileManagerModal_();
}

function moveDraftSkillPriority_(code,direction){
  const d=State.skillProfileDraft;
  if(!d)return;
  normalizeDraftSkillPriorities_();
  const c=String(code||'').trim().toUpperCase();
  const idx=d.skills.indexOf(c);
  const next=idx+Number(direction||0);
  if(idx<0||next<0||next>=d.skills.length)return;
  const temp=d.skills[idx];
  d.skills[idx]=d.skills[next];
  d.skills[next]=temp;
  d.skills.forEach((skill,i)=>d.priorities[skill]=i+1);
  renderSkillProfileManagerModal_();
}

function addDraftSkill_(){
  const d=State.skillProfileDraft;
  if(!d)return;
  const el=$('skillProfileNewCode');
  const code=String(el?.value||'').trim().toUpperCase();
  if(!code)return;
  d.priorities=d.priorities||{};
  if(!d.skills.includes(code)){
    d.skills.push(code);
    d.priorities[code]=d.skills.length;
  }
  normalizeDraftSkillPriorities_();
  renderSkillProfileManagerModal_();
}

function removeDraftSkill_(code){
  const d=State.skillProfileDraft;
  if(!d)return;
  const c=String(code||'').trim().toUpperCase();
  d.skills=d.skills.filter(x=>String(x)!==c);
  if(d.priorities)delete d.priorities[c];
  if(String(d.preferred||'')===c)d.preferred='';
  normalizeDraftSkillPriorities_();
  renderSkillProfileManagerModal_();
}

function addDraftFixedOffDate_(){
  const d=State.skillProfileDraft;
  if(!d)return;
  const el=$('skillFixedOffDate');
  const value=String(el?.value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)){
    toast('Choose a valid OFF date.','error');
    return;
  }
  d.fixedOffDates=d.fixedOffDates||[];
  if(!d.fixedOffDates.includes(value))d.fixedOffDates.push(value);
  d.fixedOffDates.sort();
  renderSkillProfileManagerModal_();
}

function removeDraftFixedOffDate_(date){
  const d=State.skillProfileDraft;
  if(!d)return;
  d.fixedOffDates=(d.fixedOffDates||[]).filter(function(x){return String(x)!==String(date);});

function renderSkills(){
  const active=(State.data.skills||[]).filter(s=>yes(s.Active)&&String(s.Skill||'').trim());
  const pharmacists=(State.data.users||[]).filter(u=>String(u.Role||'Pharmacist').toLowerCase()!=='administrator'&&yes(u.Active)).sort((a,b)=>String(a['Pharmacist Name']||'').localeCompare(String(b['Pharmacist Name']||'')));
  const bySkill={}; const byUser={};
  active.forEach(s=>{
    const code=String(s.Skill||'').trim().toUpperCase();
    if(!bySkill[code])bySkill[code]=[];
    if(!bySkill[code].some(x=>String(x.Username)===String(s.Username)))bySkill[code].push(s);
    const uk=String(s.Username==null?'':s.Username); if(!byUser[uk])byUser[uk]=[]; if(!byUser[uk].includes(code))byUser[uk].push(code);
  });
  const skillCodes=Object.keys(bySkill).sort((a,b)=>a.localeCompare(b));
  const critical=skillCodes.filter(k=>bySkill[k].length<=1).length;
  const thin=skillCodes.filter(k=>bySkill[k].length===2).length;
  const withSkills=pharmacists.filter(u=>(byUser[String(u.Username==null?'':u.Username)]||[]).length).length;
  const filter=State.skillVisualFilter||'ALL';
  const visibleCodes=skillCodes.filter(k=>filter==='ALL'||(filter==='CRITICAL'&&bySkill[k].length<=1)||(filter==='THIN'&&bySkill[k].length===2)||(filter==='HEALTHY'&&bySkill[k].length>=3));
  const maxCoverage=Math.max(3,...skillCodes.map(k=>bySkill[k].length));
  const coverageCards=visibleCodes.map(code=>{
    const people=bySkill[code].slice().sort((a,b)=>String(a['Pharmacist Name']||'').localeCompare(String(b['Pharmacist Name']||'')));
    const cls=skillCoverageClass_(people.length), pct=Math.max(8,Math.min(100,(people.length/maxCoverage)*100));
    const avatars=people.slice(0,5).map(p=>`<span class="skill-avatar" title="${attr(p['Pharmacist Name'])}">${esc(skillInitials_(p['Pharmacist Name']))}</span>`).join('');
    return `<div class="skill-cover-card ${cls}"><div class="skill-cover-top"><div><div class="skill-code">${esc(code)}</div><div class="skill-cover-status">${esc(skillCoverageLabel_(people.length))}</div></div><div class="skill-count">${people.length}</div></div><div class="skill-cover-bar"><span style="width:${pct}%"></span></div><div class="skill-people">${avatars}${people.length>5?`<span class="skill-more">+${people.length-5} more</span>`:''}</div><div class="skill-names" title="${attr(people.map(p=>p['Pharmacist Name']).join(', '))}">${esc(people.map(p=>p['Pharmacist Name']).join(', ')||'No pharmacist assigned')}</div></div>`;
  }).join('');
  const matrixHead=skillCodes.map(code=>`<th title="${attr(code)}">${esc(code)}</th>`).join('');
  const matrixRows=pharmacists.map(u=>{
    const uk=String(u.Username==null?'':u.Username), normal=new Set(byUser[uk]||[]), cover=new Set(String(u['Off-Day Coverage Skills']||'').split(/[,;|/\n]+/).map(x=>x.trim().toUpperCase()).filter(Boolean));
    return `<tr><td><div class="skill-matrix-name">${esc(u['Pharmacist Name'])}</div><div class="skill-matrix-sub">${esc(u['Schedule Type']||'Regular')} · ${normal.size} normal skill${normal.size===1?'':'s'}</div></td>${skillCodes.map(code=>{
      const p=normal.has(code)?skillPriorityForUserCodeUI_(u,code):9999;
      const normalLabel=normal.has(code)?`Normal scheduling skill · Priority ${p<9999?p:'not set'}`:cover.has(code)?'OFF-day coverage only':'Not assigned';
      return `<td><div class="skill-cell ${normal.has(code)?'on':(!normal.has(code)&&cover.has(code)?'coveronly':'')}" title="${attr(normalLabel)}">${normal.has(code)?(p<9999?'P'+p:'✓'):cover.has(code)?'○':'·'}</div></td>`;
    }).join('')}</tr>`;
  }).join('');
  const peopleCards=pharmacists.map(u=>{

function googlePtoSourceBadge_(){

  if(!api||typeof api.status!=='function')return '';
  const s=api.status();

  if(s.active&&s.source==='google'){
    return '<span class="badge badge-ok" title="PTO is loaded directly from Google Sheets">PTO Source: Google Sheet</span>';
  }
  if(s.active&&s.source==='google-cache'){
    return '<span class="badge badge-warn" title="'+attr(s.lastError||'Google source temporarily unavailable')+'">PTO Source: Google cache</span>';
  }
  return '<span class="badge badge-warn" title="'+attr(s.lastError||'Waiting for the Google PTO API deployment')+'">PTO Source: GitHub until Google API is deployed</span>';
}

function fairnessClamp(v,min,max){v=Number(v)||0;return Math.max(min,Math.min(max,v))}

function renderFairnessVisual(){
  const r=State.fairnessReport||{employees:[],averageHours:0};
  const all=(r.employees||[]).slice();
  const avg=Number(r.averageHours)||0;
  const total=all.length;
  const hours=all.map(x=>Number(x.totalHours)||0);
  const minH=hours.length?Math.min(...hours):0,maxH=hours.length?Math.max(...hours):0;
  const high=all.filter(x=>String(x.workloadFlag||'').toUpperCase()==='HIGH').length;
  const low=all.filter(x=>String(x.workloadFlag||'').toUpperCase()==='LOW').length;
  const normal=Math.max(0,total-high-low);
  const avgDev=total?all.reduce((s,x)=>s+Math.abs((Number(x.totalHours)||0)-avg),0)/total:0;
  const balanceIndex=avg>0?fairnessClamp(Math.round(100-(avgDev/avg*100)),0,100):(total?100:0);
  const balancePct=total?Math.round(normal/total*100):0;
  const totalShifts=all.reduce((s,x)=>s+(Number(x.shifts)||0),0);
  const evening=all.reduce((s,x)=>s+(Number(x.eveningShifts)||0),0);
  const night=all.reduce((s,x)=>s+(Number(x.nightShifts)||0),0);
  const weekend=all.reduce((s,x)=>s+(Number(x.weekendShifts)||0),0);
  const spread=maxH-minH;
  const maxScale=Math.max(maxH,avg*1.15,1);
  const avgMarker=fairnessClamp(avg/maxScale*100,0,100);
  const filter=State.fairnessFilter||'ALL';
  let visible=all.filter(x=>filter==='ALL'||String(x.workloadFlag||'NORMAL').toUpperCase()===filter);
  visible.sort((a,b)=>(Number(b.totalHours)||0)-(Number(a.totalHours)||0));
  const spectrum=(count)=>total?Math.max(0,count/total*100):0;
  const statusText=balanceIndex>=92?'Highly balanced':balanceIndex>=80?'Generally balanced':balanceIndex>=65?'Some imbalance':'Needs attention';
  const ringColor=balanceIndex>=80?'#0d8b84':balanceIndex>=65?'#d3a141':'#d86159';
  const chartRows=visible.map(x=>{
    const h=Number(x.totalHours)||0, delta=Number.isFinite(Number(x.hoursVsAverage))?Number(x.hoursVsAverage):h-avg;
    const pct=fairnessClamp(h/maxScale*100,1,100), cls=fairnessFlagClass(x.workloadFlag);
    return `<div class="fairness-chart-row">
      <div class="fairness-person-name"><strong>${esc(x.name)}</strong><span>${fairnessFlagBadge(x.workloadFlag)}</span></div>
      <div class="fairness-bar-shell"><div class="fairness-bar-fill ${cls}" style="width:${pct}%"></div><div class="fairness-average-marker" style="left:${avgMarker}%" title="Average ${fmtHours(avg)}"></div></div>
      <div class="fairness-hours">${fmtHours(h)}</div>
      <div class="fairness-delta ${delta>0.01?'pos':delta<-0.01?'neg':'zero'}">${delta>0?'+':''}${fmtHours(delta)}</div>
    </div>`
  }).join('');
  const cards=visible.map(x=>{
    const h=Number(x.totalHours)||0, ratio=avg>0?h/avg*100:0, ringPct=fairnessClamp(ratio,0,100), cls=fairnessFlagClass(x.workloadFlag);
    const ring=cls==='high'?'#d86159':cls==='low'?'#d3a141':'#0d8b84';
    const scalePct=fairnessClamp(h/maxScale*100,0,100);
    return `<div class="fairness-person-card">
      <div class="fairness-person-top"><div style="min-width:0"><h4>${esc(x.name)}</h4><p>${fmtHours(h)} total · ${Number(x.shifts)||0} scheduled days</p></div><div class="fairness-load-ring" style="--p:${ringPct};--ring:${ring}"><span>${Math.round(ratio||0)}%</span></div></div>
      <div>${fairnessFlagBadge(x.workloadFlag)}</div>
      <div class="fairness-card-bar"><div class="${cls}" style="width:${scalePct}%"></div></div>
      <div class="fairness-mini-stats">
        <div class="fairness-mini-stat"><strong>${Number(x.shifts)||0}</strong><span>Days</span></div>
        <div class="fairness-mini-stat"><strong>${Number(x.eveningShifts)||0}</strong><span>Evening</span></div>
        <div class="fairness-mini-stat"><strong>${Number(x.nightShifts)||0}</strong><span>Night</span></div>
        <div class="fairness-mini-stat"><strong>${Number(x.weekendShifts)||0}</strong><span>Weekend</span></div>
      </div>
    </div>`
  }).join('');
  $('content').innerHTML=`<div class="fairness-wrap">
    <div class="fairness-hero">
      <div class="fairness-score-card">
        <div class="fairness-score-ring" style="--p:${balanceIndex};--ring:${ringColor}"><div class="fairness-score-ring-inner"><strong>${balanceIndex}</strong><span>Balance index</span></div></div>
        <div class="fairness-score-copy"><div class="eyebrow">Workload equity</div><h2>${statusText}</h2><p>Visual comparison of scheduled hours across pharmacists. A higher index means workloads are clustered more closely around the team average.</p><div class="fairness-score-note">◎ ${balancePct}% currently in the normal workload band</div></div>
      </div>
      <div class="fairness-summary-card">
        <div class="fairness-summary-top"><div><h3>Team distribution</h3><p>Current saved schedule · ${total} pharmacist${total===1?'':'s'}</p></div><div class="fairness-status-pill">Average marker shown on every workload bar</div></div>
        <div class="fairness-kpis">
          <div class="fairness-kpi"><span>Average hours</span><strong>${fmtHours(avg)}</strong><small>Across visible pharmacists</small></div>
          <div class="fairness-kpi"><span>Workload range</span><strong>${fmtHours(spread)}</strong><small>${fmtHours(minH)} low · ${fmtHours(maxH)} high</small></div>
          <div class="fairness-kpi"><span>Total workdays</span><strong>${totalShifts}</strong><small>All scheduled assignments</small></div>
          <div class="fairness-kpi"><span>Off-hours load</span><strong>${evening+night}</strong><small>${evening} evening · ${night} night</small></div>
        </div>
        <div class="fairness-spectrum"><div class="fairness-spectrum-head"><span>Workload bands</span><span>${weekend} weekend assignments</span></div><div class="fairness-spectrum-bar"><div class="fairness-spectrum-high" style="width:${spectrum(high)}%"></div><div class="fairness-spectrum-normal" style="width:${spectrum(normal)}%"></div><div class="fairness-spectrum-low" style="width:${spectrum(low)}%"></div></div><div class="fairness-spectrum-legend"><div class="fairness-legend-item"><span class="fairness-legend-dot" style="background:#df7a72"></span>High ${high}</div><div class="fairness-legend-item"><span class="fairness-legend-dot" style="background:#3aa69d"></span>Balanced ${normal}</div><div class="fairness-legend-item"><span class="fairness-legend-dot" style="background:#d6a94f"></span>Low ${low}</div></div></div>
      </div>
    </div>

    <div class="fairness-toolbar"><div class="fairness-toolbar-left"><h3>Workload distribution</h3><p>Each bar shows total scheduled hours. The vertical marker is the team average.</p></div><div class="fairness-filter">${['ALL','HIGH','NORMAL','LOW'].map(f=>`<button class="${filter===f?'active':''}" onclick="fairnessSetFilter('${f}')">${f==='NORMAL'?'Balanced':f.charAt(0)+f.slice(1).toLowerCase()}</button>`).join('')}</div></div>
    <div class="fairness-chart-card"><div class="fairness-chart-head"><div>Pharmacist</div><div>Relative workload</div><div style="text-align:right">Hours</div><div style="text-align:right">vs avg</div></div><div class="fairness-chart-list">${chartRows||'<div class="fairness-empty"><b>No pharmacists in this category</b>Choose another workload band to continue.</div>'}</div></div>

    <div class="fairness-toolbar" style="margin-top:4px"><div class="fairness-toolbar-left"><h3>Pharmacist workload cards</h3><p>Quick visual comparison of days, evening, night, and weekend assignments.</p></div></div>
    <div class="fairness-people-grid">${cards||'<div class="fairness-empty"><b>No workload cards to display</b>The selected filter has no matching pharmacists.</div>'}</div>
  </div>`;
}
async function renderFairness(){
  $('content').innerHTML='<div class="card">Calculating fairness analytics…</div>';
  try{const r=await server('getFairnessReport',State.token);State.fairnessReport=r;State.fairnessFilter='ALL';renderFairnessVisual()}catch(e){toast(e.message,'error')}
}

function scheduleTable(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Shift</th><th>Pharmacist</th><th>Coverage for</th><th>Coverage reason</th><th>Type</th><th>Hours</th><th>Status</th><th>Warning</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtDate(r.Date)}</td><td><b>${esc(r.Shift)}</b></td><td>${esc(r['Assigned Pharmacist'])}</td><td>${esc(r['Coverage For Pharmacist']||'')}</td><td>${esc(r['Coverage Reason']||'')}</td><td>${typeBadge(r['Shift Type'])}</td><td>${esc(r['Credited Hours'])}</td><td>${statusBadge2(r.Status)}</td><td>${esc(r.Warning)}</td></tr>`).join('')}</tbody></table></div>`}
function statusBadge2(s){const x=String(s||'').toUpperCase();return `<span class="badge ${x==='UNFILLED'?'badge-danger':x==='LOCKED'?'badge-lock':x==='MANUAL'?'badge-manual':'badge-ok'}">${esc(s)}</span>`}

function openAssignmentModal(id,locatorDate='',locatorShift='',locatorSlot=1){const admin=State.data.isAdmin;const schedule=State.data.schedule||[];let r=null;if(id){const idMatches=schedule.filter(x=>String(x['Assignment ID']||'')===String(id));if(locatorDate&&locatorShift){r=idMatches.find(x=>String(x.Date||'')===String(locatorDate)&&String(x.Shift||'')===String(locatorShift)&&num(x.Slot,1)===num(locatorSlot,1))||schedule.find(x=>String(x.Date||'')===String(locatorDate)&&String(x.Shift||'')===String(locatorShift)&&num(x.Slot,1)===num(locatorSlot,1))||idMatches[0]||null}else r=idMatches[0]||null}if(!admin){if(!r)return;const sh=(State.data.shifts||[]).find(s=>s.Shift===r.Shift)||{};openModal('Assignment Details',`<div class="grid grid-2"><div><label>Date</label><b>${fmtDate(r.Date)}</b></div><div><label>Shift</label><b>${esc(r.Shift)}</b></div><div><label>Pharmacist</label><b>${esc(r['Assigned Pharmacist'])}</b></div><div><label>Type</label>${typeBadge(r['Shift Type'])}</div><div><label>Shift Time</label><b>${esc([sh.Start,sh.End].filter(Boolean).join(' – '))}</b></div><div><label>Credited Hours</label><b>${esc(r['Credited Hours'])}</b></div>${r['Coverage For Pharmacist']?`<div><label>Coverage for</label><b>${esc(r['Coverage For Pharmacist'])}</b></div><div><label>Coverage reason</label><b>${esc(r['Coverage Reason']||'')}</b></div>`:''}</div>${r.Warning?`<div class="alert alert-warn mt12">${esc(r.Warning)}</div>`:''}`,[{label:'Close',cls:'btn-secondary',action:'closeModal()'}]);return}
const users=State.data.users.filter(u=>yes(u.Active));const shifts=State.data.shifts.filter(s=>yes(s.Active));const body=`<input type="hidden" id="asId" value="${attr(r?r['Assignment ID']:'')}"><input type="hidden" id="asGen" value="${attr(r?r['Generation ID']:'')}"><div class="form-grid"><div class="field"><label>Date</label><input id="asDate" type="date" class="control" value="${attr(r?r.Date:dateKey(new Date()))}"></div><div class="field"><label>Slot</label><input id="asSlot" type="number" min="1" class="control" value="${attr(r?r.Slot:1)}"></div><div class="field"><label>Shift</label><select id="asShift" class="control">${shifts.map(s=>`<option value="${attr(s.Shift)}" ${r&&r.Shift===s.Shift?'selected':''}>${esc(s.Shift)} — ${esc(s.Meaning)}</option>`).join('')}</select></div><div class="field"><label>Pharmacist</label><select id="asUser" class="control">${users.map(u=>`<option value="${attr(u.Username)}" ${r&&r.Username===u.Username?'selected':''}>${esc(u['Pharmacist Name'])}</option>`).join('')}</select></div><div class="field"><label>Lock after save</label><select id="asLocked" class="control"><option ${r&&yes(r.Locked)?'selected':''}>Yes</option><option ${!r||!yes(r.Locked)?'selected':''}>No</option></select></div>${r&&r['Coverage For Pharmacist']?`<div class="field span-2"><div class="alert alert-ok"><b>Off-day coverage:</b> ${esc(r['Assigned Pharmacist'])} is covering <b>${esc(r['Coverage For Pharmacist'])}</b> for ${esc(r['Coverage Reason']||'coverage')}.</div></div>`:''}<div class="field span-2 hidden" id="overrideBox"><div class="alert alert-warn" id="overrideWarnings"></div><label class="mt12">Override reason</label><textarea id="overrideReason" class="control" placeholder="Explain why this rule violation is acceptable."></textarea></div></div>`;
const buttons=[{label:'Cancel',cls:'btn-secondary',action:'closeModal()'}];if(r){buttons.push({label:yes(r.Locked)?'Unlock':'Lock',cls:'btn-ghost',action:`toggleLockUI('${attr(r['Assignment ID'])}',${!yes(r.Locked)})`});buttons.push({label:'Remove',cls:'btn-danger',action:`removeAssignmentUI('${attr(r['Assignment ID'])}')`})}buttons.push({label:'Save',cls:'btn-primary',action:'saveAssignmentUI(false)',id:'normalSave'});openModal(r?'Edit Assignment':'Manual Assignment',body,buttons)}

function manualHoursWarningHtml(h){
  if(!h)return '';
  const weekOver=Number(h.week.projected)>Number(h.week.maximum)+0.0001;
  const periodOver=Number(h.period.projected)>Number(h.period.target)+0.0001;
  return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(120,120,120,.35)">
    <b>Pharmacist scheduled hours</b>
    <div class="small muted" style="margin:4px 0 8px">Current = hours already scheduled before this assignment. After = projected total if this assignment is saved.</div>
    <div><b>1 week (${esc(fmtDate(h.week.start))} – ${esc(fmtDate(h.week.end))}):</b> ${fmtHours(h.week.current)} current → <span style="font-weight:700${weekOver?';color:#b91c1c':''}">${fmtHours(h.week.projected)} after</span> / ${fmtHours(h.week.maximum)} max${h.week.requiredDays?`<br><span class="small"><b>Workdays:</b> ${h.week.currentDays} current → <b>${h.week.projectedDays} after</b> / exactly ${h.week.requiredDays}</span>`:''}</div>
    <div style="margin-top:5px"><b>1 month (${esc(fmtDate(h.month.start))} – ${esc(fmtDate(h.month.end))}):</b> ${fmtHours(h.month.current)} current → <b>${fmtHours(h.month.projected)} after</b></div>
    <div style="margin-top:5px"><b>2-month schedule (${esc(fmtDate(h.period.start))} – ${esc(fmtDate(h.period.end))}):</b> ${fmtHours(h.period.current)} current → <span style="font-weight:700${periodOver?';color:#b91c1c':''}">${fmtHours(h.period.projected)} after</span> / ${fmtHours(h.period.target)} target</div>
    <div style="margin-top:5px"><b>Proposed assignment:</b> ${esc(h.proposedShift)} = ${fmtHours(h.proposedHours)}</div>
  </div>`;
}

async function saveAssignmentUI(override){const p={assignmentId:$('asId').value,generationId:$('asGen').value,date:$('asDate').value,slot:$('asSlot').value,shift:$('asShift').value,username:$('asUser').value,locked:$('asLocked').value,override:override?'Yes':'No',overrideReason:override?$('overrideReason').value:''};try{const r=await server('saveManualAssignment',State.token,p);if(r.requiresOverride){$('overrideBox').classList.remove('hidden');$('overrideWarnings').innerHTML='<b>Manual assignment warnings:</b><br>'+r.warnings.map(esc).join('<br>')+manualHoursWarningHtml(r.hoursSummary);const foot=document.querySelector('.modal-foot');if(!$('overrideBtn')){const b=document.createElement('button');b.id='overrideBtn';b.className='btn btn-warning';b.textContent='Override Anyway';b.onclick=()=>saveAssignmentUI(true);foot.appendChild(b)}return}closeModal();const db=r.database||{};toast('Saved to Google Sheet'+(db.name?' — '+db.name:'')+'; unfilled slot cleared','success');await refreshData()}catch(e){toast(e.message,'error')}}
async function toggleLockUI(id,locked){try{await server('setAssignmentLock',State.token,id,locked);closeModal();toast(locked?'Assignment locked':'Assignment unlocked','success');await refreshData()}catch(e){toast(e.message,'error')}}
async function removeAssignmentUI(id){const reason=prompt('Reason for removal (optional):','')??'';if(!confirm('Remove this assignment? Required staffing slots will remain as UNFILLED.'))return;try{await server('removeAssignment',State.token,id,reason);closeModal();toast('Assignment removed','success');await refreshData()}catch(e){toast(e.message,'error')}}

function openChangePassword(force=false){const body=`<div class="field"><label>Current Password</label><input id="cpCurrent" type="password" class="control"></div><div class="field"><label>New Password</label><input id="cpNew" type="password" class="control"></div><div class="field"><label>Confirm New Password</label><input id="cpConfirm" type="password" class="control"></div><p class="small muted">Use at least 10 characters.</p>`;const btns=[];if(!force)btns.push({label:'Cancel',cls:'btn-secondary',action:'closeModal()'});btns.push({label:'Change Password',cls:'btn-primary',action:'changePasswordUI()'});openModal(force?'Change Temporary Password':'Change Password',body,btns)}
async function changePasswordUI(){if($('cpNew').value!==$('cpConfirm').value){toast('New passwords do not match','error');return}try{await server('changePassword',State.token,$('cpCurrent').value,$('cpNew').value);State.mustChange=false;closeModal();toast('Password changed','success')}catch(e){toast(e.message,'error')}}

function openModal(title,body,buttons){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${buttons.map(b=>`<button ${b.id?`id="${b.id}"`:''} class="btn ${b.cls||'btn-secondary'}" onclick="${b.action}">${esc(b.label)}</button>`).join('')}</div></div></div>`}
function closeModal(){if(State.mustChange)return;$('modalRoot').innerHTML=''}
function showSecret(title,text){openModal(title,`<div class="alert alert-warn">The temporary password is also written to the <b>Admin Accounts</b> sheet. It will be cleared after the user changes the password.</div><pre style="white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:10px;font-size:13px">${esc(text)}</pre>`,[{label:'Close',cls:'btn-primary',action:'closeModal()'}])}
</script>

<script>
(function(){
  'use strict';

  const THEME_LIBRARY = [
    {id:'1', name:'Hospital Executive', desc:'Formal hospital leadership styling.'},
    {id:'2', name:'Traditional Office', desc:'Familiar desktop and spreadsheet styling.'},
    {id:'3', name:'Classic Pharmacy', desc:'Deep green, cream, and classic clinical styling.'},
    {id:'4', name:'Windows Desktop', desc:'Compact workstation and desktop interface.'},
    {id:'5', name:'Large Print', desc:'Larger controls and high-contrast readability.'},
    {id:'6', name:'Paper Schedule', desc:'Printed schedule and spreadsheet-inspired styling.'},
    {id:'7', name:'Hospital Command Center', desc:'Operations dashboard with stronger status cues.'},
    {id:'8', name:'Minimal White', desc:'Clean, quiet, low-distraction presentation.'},
    {id:'9', name:'Futuristic Pharmacy', desc:'Modern glass-like clinical dashboard styling.'},
    {id:'10', name:'Premium Clinical Ops', desc:'Refined healthcare operations presentation.'},
    {id:'11', name:'Ultra Visual Workforce', desc:'Rich workforce analytics and visual emphasis.'}
  ];

  const STORAGE_KEY = 'pharmacySchedulerBuiltInTheme';

  function normalizeTheme(value){
    const s = String(value || '').replace(/\D/g,'');    return THEME_LIBRARY.some(t => t.id === s) ? s : '10';
  }

  function applyTheme(id){
    const safe = normalizeTheme(id);
    document.body.setAttribute('data-theme', safe);
    localStorage.setItem(STORAGE_KEY, safe);
    document.documentElement.setAttribute('data-pharmacy-theme', safe);

    const activeName = THEME_LIBRARY.find(t => t.id === safe)?.name || '';
    document.querySelectorAll('.theme-option').forEach(el => {
      el.classList.toggle('active', el.dataset.theme === safe);
    });

    const trigger = document.getElementById('pharmacyThemeTrigger');
    if(trigger){
      trigger.title = 'Theme: ' + activeName;
      trigger.setAttribute('aria-label','Change theme. Current theme: ' + activeName);
    }
  }

  function closeThemeCenter(){
    const node = document.getElementById('pharmacyThemeBackdrop');
    if(node) node.remove();
  }

  function openThemeCenter(){
    closeThemeCenter();

    const current = normalizeTheme(localStorage.getItem(STORAGE_KEY));
    const backdrop = document.createElement('div');
    backdrop.id = 'pharmacyThemeBackdrop';
    backdrop.className = 'theme-center-backdrop';

    backdrop.innerHTML = `
      <section class="theme-center" role="dialog" aria-modal="true" aria-label="Theme Center">
        <div class="theme-center-head">
          <div>
            <h3>Choose your scheduler theme</h3>
            <p>Changes apply instantly. No Code.gs change or redeployment is required.</p>
          </div>
          <button class="theme-close" type="button" aria-label="Close">×</button>
        </div>
        <div class="theme-grid">
          ${THEME_LIBRARY.map(t => `
            <article class="theme-option ${t.id===current?'active':''}" data-theme="${t.id}" tabindex="0">
              <div class="theme-preview">
                <div class="n"></div>
                <div class="m">
                  <div class="h"></div>
                  <div class="b"><div class="x"></div><div class="x"></div></div>
                </div>
              </div>
              <div class="theme-option-body">
                <div class="theme-kicker">Theme ${t.id}</div>
                <div class="theme-name">${t.name}</div>
                <div class="theme-desc">${t.desc}</div>
              </div>
            </article>
          `).join('')}
        </div>
      </section>
    `;

    document.body.appendChild(backdrop);

    backdrop.querySelector('.theme-close').addEventListener('click', closeThemeCenter);
    backdrop.addEventListener('click', e => {
      if(e.target === backdrop) closeThemeCenter();
    });

    backdrop.querySelectorAll('.theme-option').forEach(option => {
      const choose = () => {
        applyTheme(option.dataset.theme);
        closeThemeCenter();
      };
      option.addEventListener('click', choose);
      option.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          choose();
        }
      });
    });
  }

  function installThemeButton(){
    if(document.getElementById('pharmacyThemeTrigger')) return;

    const btn = document.createElement('button');
    btn.id = 'pharmacyThemeTrigger';
    btn.className = 'theme-trigger';
    btn.type = 'button';
    btn.innerHTML = '◐';
    btn.title = 'Change theme';
    btn.addEventListener('click', openThemeCenter);

    const topActions = document.querySelector('.top-actions');
    if(topActions){
      topActions.insertBefore(btn, topActions.firstChild);
      return;
    }

    btn.style.position='fixed';
    btn.style.right='18px';
    btn.style.top='18px';
    btn.style.zIndex='15000';
    document.body.appendChild(btn);
  }

  function bootThemeSwitcher(){
    const saved = normalizeTheme(localStorage.getItem(STORAGE_KEY) || '10');
    applyTheme(saved);
    installThemeButton();

    const observer = new MutationObserver(() => installThemeButton());
    observer.observe(document.body,{childList:true,subtree:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', bootThemeSwitcher, {once:true});
  }else{
    bootThemeSwitcher();
  }

  window.openPharmacyThemeCenter = openThemeCenter;
  window.applyPharmacyTheme = applyTheme;
})();
</script>
