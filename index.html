<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NeoChrono</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<section id="loginView" class="login-view">
  <div class="login-card">
    <div class="wordmark"><span class="wordmark-mark">N</span><span>NeoChrono</span></div>
    <h1>Welcome to NeoChrono</h1>
    <p>Sign in to view your pharmacy staffing schedule.</p>
    <form id="loginForm">
      <div class="field"><label for="loginUsername">Username</label><input class="control" id="loginUsername" autocomplete="username" required></div>
      <div class="field mt12"><label for="loginPassword">Password</label><input class="control" id="loginPassword" type="password" autocomplete="current-password" required></div>
      <div id="loginError" class="login-error"></div>
      <button id="loginButton" class="btn btn-primary btn-block" type="submit">Sign In</button>
      <a id="setupDeviceBtn" class="btn btn-ghost btn-block" href="device-setup.html" style="margin-top:10px;text-align:center;text-decoration:none">Setup This Device (Admin Only)</a>
    </form>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="wordmark"><span class="wordmark-mark">N</span><span>NeoChrono</span></div>
    <div class="nav" id="nav">
      <div class="nav-section">Schedule</div>
      <button data-page="dashboard">Dashboard</button>
      <button data-page="calendar">Schedule Calendar</button>
      <button data-page="mine">My Schedule</button>
      <button data-page="swaps">Swap Market</button>
      <div class="nav-section">Requests</div>
      <button data-page="requests">PTO / Availability</button>
      <button data-page="weeklyavailability">Weekly Availability</button>
      <div class="nav-section admin-only">Administrator</div>
      <button class="admin-only" data-page="employees">Pharmacists</button>
      <button class="admin-only" data-page="admins">Admin Accounts</button>
      <button class="admin-only" data-page="skills">Skills</button>
      <button class="admin-only" data-page="shifts">Shift Definitions</button>
      <button class="admin-only" data-page="staffing">Staffing Requirements</button>
      <button class="admin-only" data-page="preceptors">Preceptor Calendar</button>
      <button class="admin-only" data-page="fairness">Fairness Report</button>
      <button class="admin-only" data-page="settings">Settings</button>
      <button class="admin-only" data-page="audit">Audit Log</button>
    </div>
    <div class="sidebar-user"><div id="sessionName"></div><div id="sessionRole" class="small" style="color:#9fb3c8"></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h2 id="pageTitle">NeoChrono</h2>
      <div class="top-actions">
        <button id="refreshBtn" class="btn btn-ghost">Refresh</button>
        <button id="changePasswordBtn" class="btn btn-ghost">Change Password</button>
        <button id="logoutBtn" class="btn btn-secondary">Sign Out</button>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modalRoot"></div>
<script type="module" src="js/app.js?v=20260918-4"></script>
</body>
</html>
